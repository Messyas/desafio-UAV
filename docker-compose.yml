services:
  api:
    build: .
    container_name: uavids_api
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/workspace/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////workspace/mlruns/mlflow.db
      - CUDA_VISIBLE_DEVICES=-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
